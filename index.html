
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    #toggle-container {
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 30px;
      font-weight: 700;
    }

    #toggle-button {
      padding: 14px 32px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #toggle-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
    }

    #toggle-button:active {
      transform: translateY(-1px);
    }

    #message {
      margin-top: 30px;
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 0.5s ease-out;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div id="toggle-container">
    <h1 class="title">✨ Toggle Message</h1>
    
    <button id="toggle-button" onclick="handleToggleVisibility()">
      <span class="btn-icon">👁️‍🗨️</span>
      <span id="btn-text">Show Message</span>
    </button>

    <p id="message" style="display: none;">
      💖 I love freeCodeCamp!
    </p>
  </div>

  <script>
    let isVisible = false;

    function handleToggleVisibility() {
      isVisible = !isVisible;
      const messageEl = document.getElementById('message');
      const btnTextEl = document.getElementById('btn-text');
      const btnIcon = document.querySelector('.btn-icon');

      if (isVisible) {
        messageEl.style.display = 'block';
        btnTextEl.textContent = 'Hide Message';
        btnIcon.textContent = '👁️';
      } else {
        messageEl.style.display = 'none';
        btnTextEl.textContent = 'Show Message';
        btnIcon.textContent = '👁️‍🗨️';
      }
    }
  </script>
</body>
</html>
